<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Supabase Pro — arquitetura de backend SaaS multi-tenant</title>
  <desc id="desc">Mapa de arquitetura com autenticação, RLS, PostgreSQL, Storage, Realtime, funções, vetores e isolamento entre tenants.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#06151a"/><stop offset=".6" stop-color="#0b2032"/><stop offset="1" stop-color="#17183f"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#5eead4" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/><rect width="640" height="360" rx="18" fill="url(#grid)"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#334155"/>
